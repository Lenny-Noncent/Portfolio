<div class="project-overview" data-appear-stagger="150">

    <!-- Head: Back button (from left) then Project name (from bottom), same as all-projects-page -->
    <div class="section-head project-overview-head" data-appear="default" data-appear-stagger="150">

        <!-- Back Button (fallback href set by project-overview.js, used if there is no previous page) -->
        <!-- Note: Appear is on a wrapper, otherwise its kept translate would block the button hover lift -->
        <div data-appear="fromLeft">
            <a class="btn btn-ghost btn-back">
                <i class="fa-solid fa-arrow-left"></i>
                Retour
            </a>
        </div>

        <!-- Project Name -->
        <div data-appear="fromBottom">
            <span class="section-eyebrow">// Projet</span>
            <h1 class="project-overview-name"></h1>
        </div>
    </div>

    <!-- Media (YouTube video if project has one, else image; filled by project-overview.js) -->
    <div class="project-overview-media" data-appear="fromBottomSmoothed"></div>

    <!-- Boxes (stacked) -->
    <div class="project-overview-boxes" data-appear="default" data-appear-stagger="150">

        <!-- Box: Description -->
        <div class="project-overview-box spotlight" data-appear="fromLeftSmoothed">
            <h2 class="project-overview-box-title">Description</h2>
            <p class="project-overview-description"></p>
        </div>

        <!-- Box: Infos (rows filled by project-overview.js) -->
        <div class="project-overview-box spotlight" data-appear="fromLeftSmoothed">
            <h2 class="project-overview-box-title">Informations</h2>
            <ul class="project-overview-infos"></ul>
        </div>
    </div>

</div>
